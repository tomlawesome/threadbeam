name: docker-publish

# dev deliberately publishes nothing -- keeps dev cheap/fast, and a
# moving-target image built from unreviewed dev work isn't something
# worth shipping to the registry. preview publishes the actual release
# candidate; main never rebuilds, it only ever promotes (retags) the
# exact digest that was already built, scanned and smoke-tested from
# preview -- see ci.yml's container job, which runs on preview.
on:
  push:
    branches:
      - preview
      - main
  workflow_dispatch:
    inputs:
      preview_digest:
        description: >-
          Optional exact preview digest to promote, beginning sha256:.
          Only used by the main promotion. Leave empty to resolve the
          digest from the preview tag this merge promotes -- either way
          the digest is fully verified before anything is retagged.
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-preview:
    name: Build + publish preview image
    if: github.ref_name == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless (Fulcio/Rekor) signing needs an OIDC token, and the
      # attestations are written back to this repository and to GHCR.
      # No long-lived signing key is created, stored or exposed: the
      # token is minted per run, scoped to this repository and workflow,
      # and expires with the job -- so there is nothing to leak or
      # rotate. Both scopes are granted only to this job.
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - id: sha
        name: Compute short SHA
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        name: Compute image tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview
            type=raw,value=preview-${{ steps.sha.outputs.short }}
          # org.opencontainers.image.revision comes from metadata-action;
          # the source-branch label is ours. promote-to-main refuses to
          # promote a digest that does not carry both, so a hand-pushed
          # or otherwise unprovenanced image can never reach :latest.
          labels: |
            io.github.tomlawesome.threadbeam.source-branch=${{ github.ref_name }}

      # Built and loaded locally, NOT pushed: nothing reaches the
      # registry until it has passed the vulnerability scan below.
      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: threadbeam:preview-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reject high-severity image vulnerabilities and produce SBOM
        env:
          # Digest-pinned so the scanner itself is immutable; the
          # vulnerability database is still fetched fresh at scan time.
          TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # v0.74.0
        run: |
          mkdir -p .threadbeam-supply-chain .threadbeam-trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/.threadbeam-trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --exit-code 1 --severity HIGH,CRITICAL threadbeam:preview-candidate
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/.threadbeam-trivy-cache:/root/.cache/trivy" \
            --volume "${PWD}/.threadbeam-supply-chain:/evidence" \
            "${TRIVY_IMAGE}" image --skip-db-update --format spdx-json \
            --output /evidence/image.spdx.json threadbeam:preview-candidate

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        name: Publish the exact scanned image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          digest=""
          # Every tag is just a name for one immutable manifest. Push
          # them all from the single scanned local image and assert they
          # all resolve to the same digest -- that digest is the thing
          # we attest, and the only thing main will promote.
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker tag threadbeam:preview-candidate "${tag}"
            docker push "${tag}"
            tag_digest="$(docker buildx imagetools inspect "${tag}" \
              | awk '$1 == "Digest:" {print $2; exit}')"
            test -n "${tag_digest}"
            if [ -z "${digest}" ]; then
              digest="${tag_digest}"
            else
              test "${tag_digest}" = "${digest}"
            fi
          done <<< "${TAGS}"
          test -n "${digest}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: .threadbeam-supply-chain/image.spdx.json
          push-to-registry: true

  promote-to-main:
    name: Promote the tested preview image to latest
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can move :latest, so it is the only one gated on
    # an environment. production allows protected branches only, which
    # means a workflow_dispatch from an unprotected branch cannot reach
    # the promotion even if the ref_name guard above were edited away.
    # No approval reviewers: the preview -> main pull request is already
    # the human decision point, and a second click would gate the same
    # call twice. The environment is also where any registry credential
    # beyond GITHUB_TOKEN should live if one is ever needed.
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve which preview commit this merge promotes
        id: source
        run: |
          set -euo pipefail
          # A standard (non-squash, non-rebase) merge commit's second
          # parent is preview's tip at merge time -- what
          # publish-preview built and tagged preview-<short sha> from.
          # Falls back to HEAD itself for a fast-forward merge (no
          # second parent), same commit either way.
          parent="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
          echo "short=$(git rev-parse --short=7 "$parent")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Tags are mutable, so a tag is only ever a starting point here.
      # Whatever the tag resolves to is pinned to an immutable digest
      # and then has to prove it is the artifact this commit was built
      # from -- signed provenance, matching labels, and a source commit
      # that is both an ancestor of HEAD and tree-identical to it --
      # before it is allowed anywhere near :latest. Every check fails
      # closed.
      - name: Verify the exact preview digest and promote it -- no rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHORT: ${{ steps.source.outputs.short }}
          REQUESTED_DIGEST: ${{ inputs.preview_digest }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"

          if [ -n "${REQUESTED_DIGEST}" ]; then
            digest="${REQUESTED_DIGEST}"
          else
            digest="$(docker buildx imagetools inspect "${image}:preview-${SHORT}" \
              | awk '$1 == "Digest:" {print $2; exit}')"
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          # 1. The digest carries provenance signed by this repository.
          gh attestation verify "oci://${image}@${digest}" --repo "${GITHUB_REPOSITORY}"

          docker pull "${image}@${digest}"
          revision="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${image}@${digest}")"
          source_branch="$(docker image inspect \
            --format '{{ index .Config.Labels "io.github.tomlawesome.threadbeam.source-branch" }}' \
            "${image}@${digest}")"

          # 2. It was built from preview, not from some other branch.
          test "${source_branch}" = preview
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]

          # 3. That source commit really is part of this main history.
          git merge-base --is-ancestor "${revision}" HEAD

          # 4. And the code in the image is byte-identical to what main
          #    now holds -- catches a merge that quietly changed content.
          git diff --quiet "${revision}^{tree}" "HEAD^{tree}"

          echo "Promoting ${image}@${digest} (revision ${revision}) -> ${image}:latest"
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:latest" "${image}@${digest}"
