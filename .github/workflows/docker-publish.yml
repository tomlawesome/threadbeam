name: docker-publish

# dev deliberately publishes nothing -- keeps dev cheap/fast, and a
# moving-target image built from unreviewed dev work isn't something
# worth shipping to the registry. preview publishes the actual release
# candidate; main never rebuilds, it only ever promotes (retags) the
# exact digest that was already built and smoke-tested from preview --
# see ci.yml's container job, which runs on preview.
on:
  push:
    branches:
      - preview
      - main
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-preview:
    name: Build + publish preview image
    if: github.ref_name == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        name: Compute short SHA
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        name: Compute image tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview
            type=raw,value=preview-${{ steps.sha.outputs.short }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-to-main:
    name: Promote the tested preview image to latest
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve which preview commit this merge promotes
        id: source
        run: |
          # A standard (non-squash, non-rebase) merge commit's second
          # parent is preview's tip at merge time -- what
          # publish-preview built and tagged preview-<short sha> from.
          # Falls back to HEAD itself for a fast-forward merge (no
          # second parent), same commit either way.
          parent="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
          echo "short=$(git rev-parse --short=7 "$parent")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Retag the exact preview digest as latest -- no rebuild
        run: |
          src="ghcr.io/${{ github.repository }}:preview-${{ steps.source.outputs.short }}"
          dst="ghcr.io/${{ github.repository }}:latest"
          echo "Promoting $src -> $dst (no rebuild)"
          docker buildx imagetools create --tag "$dst" "$src"
