name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag threadbeam:test .

      - name: Run hardened container
        run: >-
          docker run --detach --name threadbeam-test
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 128m --cpus 0.5
          --publish 127.0.0.1:4317:4317
          threadbeam:test

      - name: Wait for status endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4317/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs threadbeam-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force threadbeam-test || true
