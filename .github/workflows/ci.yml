name: CI

# Three-lane model, same structure as this project's siblings (mikroview,
# birdcage): dev (light, fast feedback, unprotected) -> preview
# (protected, extended testing gate, publishes the release candidate
# image) -> main (protected, promotion only -- retags preview's exact
# tested digest, never rebuilds).
on:
  push:
    branches: [main, preview, dev]
  pull_request:
    branches: [main, preview, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  # Not run on dev, matching "dev stays light" -- the extended gate
  # (this, plus CodeQL) is what preview exists for, before anything is
  # eligible to move toward main.
  container:
    name: Container smoke test
    if: github.base_ref != 'dev' && github.ref_name != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag threadbeam:test .

      - name: Run hardened container
        run: >-
          docker run --detach --name threadbeam-test
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 128m --cpus 0.5
          --publish 127.0.0.1:4317:4317
          threadbeam:test

      - name: Wait for status endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4317/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs threadbeam-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force threadbeam-test || true
