<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="threadbeam-mark-title threadbeam-mark-desc">
  <title id="threadbeam-mark-title">Threadbeam</title>
  <desc id="threadbeam-mark-desc">Four bright colored threads converge into a glowing point and fire a beam of light, on a dark rounded square.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bfe4ff"/>
      <stop offset="100%" stop-color="#6cb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#9fd6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6cb8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0a0e14" stroke="#26344a" stroke-width="1.5"/>

  <!-- four threads, sharper angles, thicker, saturated -->
  <g fill="none" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M7 8 L38 30" stroke="#a06bff"/>
    <path d="M7 20 L38 31" stroke="#2f9bff"/>
    <path d="M7 44 L38 33" stroke="#00e0a8"/>
    <path d="M7 56 L38 34" stroke="#ff7a3d"/>
  </g>

  <!-- beam shooting out, drawn after threads so it reads on top -->
  <path d="M39 32 L61 21 L61 43 Z" fill="url(#beam)" filter="url(#softglow)"/>
  <path d="M39 32 L61 21 L61 43 Z" fill="url(#beam)" opacity="0.9"/>

  <!-- hot core -->
  <circle cx="40" cy="32" r="11" fill="url(#core)"/>
  <circle cx="40" cy="32" r="4.6" fill="#ffffff"/>
</svg>
